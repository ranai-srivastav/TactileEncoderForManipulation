# W&B Modality Interaction Sweep
# Exhaustive grid over 8 modality combinations — all other params fixed.
# Goal: understand which sensors contribute and how they interact.
#
# Usage:
#   wandb sweep sweep.yaml          # prints <sweep-id>
#   wandb agent mrsd-smores/TEMU/<sweep-id>
#
# On Bridges-2 (parallel agents):
#   Put the wandb agent command in a SLURM job script and sbatch it N times.

program: train.py
method: grid
metric:
  name: val/f1
  goal: maximize

parameters:
  # ── Swept: modality combinations ──────────────────────────────────────────
  modalities:
    values:
      - [V, T, FT, G, GF]   # all modalities
      - [V, T]               # vision only (RGB + tactile)
      - [T]                  # tactile only
      - [V]                  # RGB only
      - [FT, G, GF]          # non-visual sensors only
      - [V, T, FT]           # vision + force-torque
      - [V, FT, G, GF]       # no tactile
      - [T, FT, G, GF]       # no RGB

  # ── Fixed: dataset ────────────────────────────────────────────────────────
  root_dir:
    value: /ocean/projects/cis260031p/shared/dataset/Gelsight
  split:
    value: random
  L:
    value: 20
  F1:
    value: 1
  F2:
    value: 1
  subsample:
    value: 1.0          # full dataset

  # ── Fixed: training loop ──────────────────────────────────────────────────
  n_iters:
    value: 600
  batch_size:
    value: 32
  num_workers:
    value: 4
  lr:
    value: 0.01
  weight_decay:
    value: 0.01
  dropout:
    value: 0.1
  clip_grad_norm:
    value: 1.0

  # ── Fixed: optimizer / scheduler ──────────────────────────────────────────
  optimizer:
    value: sgd           # sgd (momentum=0.9) or adamw
  lr_scheduler:
    value: step          # step | cosine_warm | none
  anneal_iter:
    value: 300           # LR drop iteration (for lr_scheduler=step)
  cosine_t0:
    value: 100           # only active with lr_scheduler=cosine_warm
  cosine_t_mult:
    value: 2             # only active with lr_scheduler=cosine_warm

  # ── Fixed: class imbalance (DRS) ──────────────────────────────────────────
  sigma:
    value: 1.0           # DRS target S≠/S= ratio — float, must be >= natural ratio
  drs_iter:
    value: 400           # iteration at which DRS activates

  # ── Fixed: architecture ───────────────────────────────────────────────────
  hidden_dim:
    value: 256
  lstm_layers:
    value: 2
  n_outputs:
    value: 1             # 1=BCEWithLogitsLoss, 2=CrossEntropyLoss
  freeze:
    value: [resnet_rgb, resnet_tactile]   # both ResNets frozen; projection/gru/classifier trainable

  # ── Fixed: checkpointing / W&B ────────────────────────────────────────────
  model_save_path:
    value: trained_models/best_model.pt
  wandb_project:
    value: TEMU
  wandb_entity:
    value: mrsd-smores
